name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Deliberately public test values, never production credentials.
      JWT_SECRET_KEY: ci-only-fake-jwt-secret-never-use-in-production-123456
      POSTGRES_PASSWORD: ci_only_disposable_database
      COMPOSE_PROJECT_NAME: smart-campus-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify API and frontend routing
        run: |
          curl --fail --show-error --max-time 15 http://localhost:8000/api/v1/health
          curl --fail --show-error --max-time 15 http://localhost:8080/api/v1/health
          curl --fail --show-error --max-time 15 --head http://localhost:8080/grades
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Tear down stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run disposable Docker E2E suite
        run: sh scripts/e2e.sh
      - name: Upload failure report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Ensure E2E stack and volumes are removed
        if: always()
        env:
          JWT_SECRET_KEY: e2e-only-fake-jwt-secret-never-use-in-production-123456
          POSTGRES_PASSWORD: e2e_only_fake_password
        run: >-
          docker compose --env-file /dev/null
          -p smart-campus-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          -f compose.yaml -f compose.e2e.yaml down -v --remove-orphans
