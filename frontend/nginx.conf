# Resolve private service addresses again after a redeployment.
resolver ${NGINX_RESOLVERS} valid=10s;
upstream campus_backend {
    zone campus_backend 64k;
    server ${BACKEND_HOST}:${BACKEND_PORT} resolve;
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
