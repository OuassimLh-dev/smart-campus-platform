services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_campus
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_local_only}
    volumes:
      - campus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d smart_campus"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGDATABASE: smart_campus
      PGUSER: campus_user
      PGPASSWORD: ${POSTGRES_PASSWORD:-campus_local_only}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://campus_user:${POSTGRES_PASSWORD:-campus_local_only}@db:5432/smart_campus
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  campus_postgres:
